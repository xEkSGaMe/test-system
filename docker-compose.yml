version: '3.8'

services:
  # База данных пользователей и тестов
  postgres:
    image: postgres:13-alpine
    container_name: test-system-postgres
    environment:
      POSTGRES_DB: test_system
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./core/migrations:/docker-entrypoint-initdb.d
    networks:
      - test-network
    restart: unless-stopped

  # Redis для сессий и бота (оставляем один общий)
  redis:
    image: redis:6.2-alpine
    container_name: test-system-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - test-network
    restart: unless-stopped

  # Сервис авторизации (Go)
  auth-service:
    build:
      context: ./auth
    container_name: test-system-auth
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      PORT: "8081"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "test_system"
      DB_USER: "admin"
      DB_PASSWORD: "admin123"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres
      - redis
    networks:
      - test-network

  # Основной API (C++)
  core-service:
    build:
      context: ./core
    container_name: test-system-core
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://admin:admin123@postgres:5432/test_system
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      - postgres
      - auth-service
    networks:
      - test-network
    restart: unless-stopped

  # Telegram Бот (Python)
  bot:
    build:
      context: ./telegram-bot
    container_name: test-system-bot
    env_file:
      - .env
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - AUTH_API_URL=http://auth-service:8081
      - CORE_API_URL=http://core-service:8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - auth-service
      - core-service
      - redis
    networks:
      - test-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  test-network:
    driver: bridge