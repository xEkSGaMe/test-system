# Docker Compose для тестовой системы
# Версии выбраны для совместимости с процессорами без AVX

services:
  # PostgreSQL - используем более стабильную версию
  postgres:
    image: postgres:13-alpine
    environment:
      POSTGRES_DB: test_system
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./core/migrations:/docker-entrypoint-initdb.d
    networks:
      - test-network
    restart: unless-stopped

  # MongoDB - версия 4.4 не требует AVX
  mongodb:
    image: mongo:4.4
    container_name: test-system-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: test_system
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - test-network
    restart: unless-stopped

  # Redis - стабильная версия
  redis:
    image: redis:6.2-alpine
    container_name: test-system-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - test-network
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth
    container_name: test-system-auth
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      PORT: "8081"
      ENV: "development"
      # Данные должны СОВПАДАТЬ с блоком postgres выше
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "test_system"
      DB_USER: "admin"
      DB_PASSWORD: "admin123"
      DB_SSL_MODE: "disable"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}  # ← БЕРЕТ ИЗ .env
    depends_on:
      - postgres
      - redis
    networks:
      - test-network
      
  # Core Service (C++) - ОБНОВЛЯЕМ ЭТОТ БЛОК!
  core-service:
    build:
      context: ./core
    container_name: test-system-core
    environment:
      DATABASE_URL: postgres://admin:admin123@postgres:5432/test_system
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}  # ← ДОБАВИТЬ
      AUTH_SERVICE_URL: http://auth-service:8081  # ← ДОБАВИТЬ
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - auth-service  # ← ДОБАВИТЬ ЗАВИСИМОСТЬ ОТ AUTH
    networks:
      - test-network
    restart: unless-stopped

volumes:
  postgres_data:
  mongodb_data:
  redis_data:

networks:
  test-network:
    driver: bridge